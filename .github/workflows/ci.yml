name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: the pnpm store cache below needs pnpm on PATH.
      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      # 24 is the newest runtime @astrojs/vercel 11 supports, so it is what
      # this project's functions get. It was 22 under adapter 8.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
